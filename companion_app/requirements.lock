# companion_app/requirements.lock
# =============================================================================
# FULLY-PINNED, KNOWN-GOOD dependency set for the Audio Mixer companion app.
#
# WHY THIS FILE EXISTS (read before changing anything):
#   The voice-isolation feature broke 20+ times "with zero code edits" because
#   requirements.txt left torch/torchaudio/numpy LOOSE (>=). A background pip
#   reinstall or transitive update pulled a newer torch, which silently changed
#   Demucs' MPS / segmenting / OOM behavior and made /v1/stems/split return 500
#   on byte-identical code. This lock freezes the EXACT versions that are verified
#   working on Apple Silicon (MPS) so the environment can never drift underneath us.
#
# CAPTURED FROM the running service's venv on 2026-07-07 via:
#   .venv/bin/python -m pip freeze --all
# Verified working: torch 2.2.2 + torchaudio 2.2.2 + numpy 1.26.4 + demucs 4.0.1,
# Python 3.11, torch.backends.mps.is_available() == True.
#
# HOW TO USE (canonical install path):
#   python3.11 -m venv .venv
#   .venv/bin/python -m pip install -r companion_app/requirements.lock
#
# requirements.txt remains the human-readable top-level spec; THIS file is the
# reproducible source of truth the installer and doctor.sh check against.
# To intentionally bump a dependency: change it in a venv, re-run the freeze,
# re-run checkpoints/release_gate.sh, and only then commit the new lock.
# =============================================================================
